controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
    FollowPath:
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      translation_kp: 1.0
      translation_ki: 0.0
      translation_kd: 0.1
      enable_rotation: true
      rotation_kp: 1.0
      rotation_ki: 0.0
      rotation_kd: 0.1
      transform_tolerance: 0.3
      min_max_sum_error: 0.5
      use_velocity_scaled_lookahead_dist: false
      lookahead_time: 1.0
      lookahead_dist: 0.40
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.80
      use_interpolation: false
      motion_mode: "omni_head_default"
      use_rotate_to_heading_treshold: 0.8
      rotate_to_heading_distance: 0.08
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.80
      min_approach_yaw_velocity: 0.05
      approach_yaw_scaling_euler: 0.5
      v_linear_min: -0.20
      v_linear_max: 0.20
      v_angular_min: -0.35
      v_angular_max: 0.35
      curvature_min: 0.4
      curvature_max: 0.7
      reduction_ratio_at_high_curvature: 0.5
      curvature_forward_dist: 0.7
      curvature_backward_dist: 0.3
      max_velocity_scaling_factor_rate: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[-0.40, -0.40], [-0.40, 0.40], [0.40, 0.40], [0.40, -0.40]]"
      footprint_padding: 0.05
      plugins: ["mid360_obstacle_layer", "inflation_layer"]
      mid360_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: mid360
        mid360:
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.10
          max_obstacle_height: 1.80
          obstacle_min_range: 0.45
          obstacle_max_range: 6.0
          raytrace_min_range: 0.45
          raytrace_max_range: 8.0
          observation_persistence: 0.20
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[-0.40, -0.40], [-0.40, 0.40], [0.40, 0.40], [0.40, -0.40]]"
      footprint_padding: 0.05
      plugins: ["mid360_obstacle_layer", "inflation_layer"]
      mid360_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: mid360
        mid360:
          topic: /livox/lidar
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.10
          max_obstacle_height: 1.80
          obstacle_min_range: 0.45
          obstacle_max_range: 6.0
          raytrace_min_range: 0.45
          raytrace_max_range: 8.0
          observation_persistence: 0.20
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.70
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
